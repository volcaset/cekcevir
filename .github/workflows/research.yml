name: research
on:
  push:
    branches: [research-models]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q "transformers<5" sentencepiece sacremoses sacrebleu protobuf
      - run: python scripts/research/eval_mt.py
